<script>
/* compat for old Android WebView (Chrome 66) */
if(!Promise.allSettled)Promise.allSettled=function(ps){return Promise.all(Array.from(ps,function(p){return Promise.resolve(p).then(function(v){return{status:"fulfilled",value:v};},function(e){return{status:"rejected",reason:e};});}));};
(function(){var d=document.createElement("div");d.style.cssText="display:flex;flex-direction:column;row-gap:1px;position:absolute";d.appendChild(document.createElement("div"));d.appendChild(document.createElement("div"));document.documentElement.appendChild(d);var ok=d.scrollHeight===1;d.remove();if(!ok)document.documentElement.className+=" nogap";})();

<script>
/* ======================= CONFIG — edit these ======================= */
const CONFIG = {
  spotName: "Ilha do Guajiru",
  lat: -2.8759, lon: -39.9216,
  tz: "America/Fortaleza",
  videoList: "https://raw.githubusercontent.com/lefty113/projector-tv/main/videos.json", // written every 6 h by the GitHub Action
  videoMinutes: 1e9,      // clips only — the forecast slide is switched off
  forecastSeconds: 10,    // wind forecast slide (only used if videoMinutes is set to a real number)
  channelMix: { batevento: 4, epicgust: 1 },  // share of clips: 4 of every 5 from Bate Vento, 1 from Epic Gust
  clipSeconds: 60,        // length of one clip, then the next video
  noRepeatMinutes: 90,    // the same section of a video never replays within this time
  loadTimeoutSec: 20,     // skip a clip that won't start within this time
  stallSec: 10,           // skip a clip frozen this long
  leftSafe: 0,            // % of screen width kept empty on the left. 0 = none
  station: 16561,         // Windguru live station (KWind Ilha do Guajiru)
  refreshMinutes: 15,
  updateCheckMinutes: 2   // how often the screen checks GitHub for a new version
};

<style>
:root{
  --canvas:#EDEDF0; --card:#FFFFFF; --ink:#000000; --ink2:#2C2C2E; --hair:#D1D1D6;
  --blue:#0058B8; --amber:#A64800; --tide:#0A84FF; --shade:#F2F2F5;
  --shadow:0 1px 2px rgba(0,0,0,.05),0 8px 28px rgba(0,0,0,.08);
  --r:1.6vw;
}
:root[data-theme="night"]{
  --canvas:#000000; --card:#16161A; --ink:#FFFFFF; --ink2:#F2F2F7; --hair:#3A3A3C;
  --blue:#5AC8FA; --amber:#FFB340; --tide:#5AC8FA; --shade:#0E0E11;
  --shadow:0 0 0 1px rgba(255,255,255,.06);
}
html,body,.card,#stage{transition:background-color 1.5s ease,color 1.5s ease}
.lg-n{display:none}
:root[data-theme="night"] .lg-d{display:none}
:root[data-theme="night"] .lg-n{display:block}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--canvas);color:var(--ink);font-family:Inter,system-ui,sans-serif;overflow:hidden;cursor:none;-webkit-font-smoothing:antialiased}
#app{display:flex;flex-direction:column;height:100vh;padding:0 1.6vw 1.6vw calc(1.6vw + var(--leftsafe,0vw))}
.datasl .eyebrow,.datasl h2{text-align:right}
#stage{flex:1;min-height:0;position:relative;border-radius:var(--r);overflow:hidden;background:var(--card);box-shadow:var(--shadow)}
.slide{position:absolute;top:0;right:0;bottom:0;left:0;opacity:0;transform:scale(1.015);transition:opacity 1s ease,transform 1.4s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column}
.slide.on{opacity:1;transform:none}
.slide img,.slide video{width:100%;height:100%;object-fit:cover}
.slide iframe{width:100%;height:100%;border:0}
.datasl{padding:2.6vw 2.8vw 2vw}
.eyebrow{font-size:1.25vw;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2)}
.datasl h2{font-size:3.4vw;font-weight:700;letter-spacing:-.025em;line-height:1.05;margin:.3vw 0 1.6vw}
.chart{flex:1;min-height:0;display:flex;flex-direction:column}
.chart svg{width:100%;height:100%}
#side{display:flex;flex-direction:column;gap:0.6vw;min-height:0;overflow:hidden}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:0.75vw 0.8vw}
.lbl{font-size:0.8vw;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);margin-bottom:0.25vw}
#top{display:flex;justify-content:space-between;align-items:flex-start}
#clock{font-size:4.6vw;font-weight:700;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums}
#date{font-size:1.4vw;font-weight:600;color:var(--ink2);margin-top:.5vw}
#logos{margin:0!important;padding:0!important;border:0!important;display:flex;align-items:center;justify-content:space-between;gap:0.5vw;margin-bottom:0.5vw;padding-bottom:0.5vw;border-bottom:1px solid var(--hair)}#logos img{height:2.5vw;width:auto;flex:none;max-width:none}
.wind{display:flex;align-items:center;gap:0.6vw;margin-top:0.15vw}
.big{font-size:2.8vw;font-weight:700;letter-spacing:-.045em;line-height:.9;font-variant-numeric:tabular-nums}
.big small{font-size:0.9vw;font-weight:700;color:var(--ink2);letter-spacing:0;margin-left:0.15vw}
.meta{font-size:0.8vw;font-weight:600;color:var(--ink2);margin-top:0.2vw}
.pill{display:inline-block;padding:.25vw .7vw;border-radius:99px;font-size:.85vw;font-weight:600;margin-top:.7vw}
.arrow{width:2.2vw;height:2.2vw;flex:none}
#minitide{flex:1;min-height:0;margin:.2vw -.4vw 0}
#minitide svg{width:100%;height:100%}
.tidenext{display:flex;justify-content:space-between;margin-top:.6vw}
.tidenext div{font-size:1.2vw;color:var(--ink2);font-weight:600}
.tidenext b{display:block;font-size:2.5vw;font-weight:700;letter-spacing:-.03em;color:var(--ink)}
#best b{font-size:2.2vw;font-weight:700;letter-spacing:-.03em;display:block}
#best span{font-size:1vw;color:var(--ink2)}
#foot{margin-top:auto;padding-bottom:.2vw;font-size:.8vw;color:var(--ink2);opacity:.6;text-align:center}
/* Windguru-style table */
.wg{width:100%;border-collapse:separate;border-spacing:.25vw;margin:auto 0;table-layout:fixed;font-variant-numeric:tabular-nums}
.wg th,.wg td{text-align:center;font-size:1.5vw;padding:0}
.wg tbody td:not(.rowlbl){border-radius:.5vw}
.wg tr.r-c td{height:6.4vw}.wg tr.r-g td{height:4.8vw}.wg tr.r-dir td{height:4.6vw}.wg tr.r-small td{height:3.4vw}
.wg .rowlbl{width:8vw;text-align:left;font-size:1.05vw;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);padding-right:.6vw}
.wg thead .day th{font-size:1.9vw;font-weight:700;letter-spacing:-.01em;color:var(--ink);padding-bottom:.4vw;border-bottom:1px solid var(--hair)}
.wg thead .hr th{font-size:1.35vw;font-weight:700;color:var(--ink2);padding:.9vw 0}
.wg td.c{font-weight:800;font-size:2.3vw;color:#000!important;letter-spacing:-.03em}
.wg td.g{font-weight:700;font-size:1.9vw;color:#000!important}
.wg td.sep,.wg th.sep{border-left:.8vw solid var(--card)}
.wg tbody tr:first-child td.c:not(.rowlbl){border-radius:0}
.wg .dir svg{width:2.8vw;height:2.8vw}
.wg .small{color:var(--ink);font-size:1.6vw;font-weight:600}
.legend{display:flex;align-items:center;gap:.8vw;margin-top:auto;padding-top:1vw;font-size:1.05vw;font-weight:600;color:var(--ink2)}
.legend i{display:inline-block;width:2.2vw;height:.7vw;border-radius:99px}
.err{color:var(--amber);font-size:1.2vw}
.yt{background:#000}.ytbox{position:absolute;top:0;right:0;bottom:0;left:0}.ytbox iframe{width:100%;height:100%;border:0;pointer-events:none}
.cap{position:absolute;left:1.6vw;bottom:1.4vw;max-width:70%;padding:.6vw 1vw;border-radius:.8vw;background:rgba(0,0,0,.55);color:#fff;font-size:1.25vw;font-weight:600;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.cap span{font-weight:800;letter-spacing:.06em;text-transform:uppercase;margin-right:.6vw;color:#5AC8FA}
#full{position:fixed;top:0;right:0;bottom:0;left:0;z-index:20;background:#000;opacity:0;transition:opacity 1s ease;pointer-events:none}#full.on{opacity:1}#full .slide video{object-fit:contain;background:#000}
.ph{position:absolute;top:0;right:0;bottom:0;left:0;overflow:hidden;background:#000}.ph img{position:absolute;top:0;right:0;bottom:0;left:0;width:100%;height:100%}.ph .bg{object-fit:cover;filter:blur(40px) brightness(.55);transform:scale(1.2)}.ph .fg{object-fit:cover}.ph.portrait .fg{object-fit:contain}.kb{animation:kb 11s ease-out forwards}@keyframes kb{from{transform:scale(1)}to{transform:scale(1.08)}}
@media (prefers-reduced-motion: reduce){ .slide{transform:none!important;transition:opacity .6s ease} .kb{animation:none} }
.nogap #side>*+*{margin-top:0.6vw}.nogap #logos>*+*{margin-left:0.5vw}.nogap .wind>*+*{margin-left:0.6vw}.nogap .legend>*+*{margin-left:0.4vw}
.wword{display:inline-block;margin-top:0.5vw;padding:0.175vw 0.5vw;border-radius:99px;font-size:0.8vw;font-weight:700}
.tidelist{display:flex;flex-direction:column;justify-content:space-around;flex:1}
.tiderow{display:flex;align-items:baseline;justify-content:space-between;padding:0.25vw 0;border-bottom:1px solid var(--hair)}.tiderow:last-child{border-bottom:0}
.tiderow span{font-size:0.8vw;font-weight:700;color:var(--ink2);text-transform:uppercase;letter-spacing:.06em}
.tiderow b{font-size:1.5vw;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
/* top info line */
#bar{flex:none;height:13.5vh;display:flex;align-items:center;justify-content:center;white-space:nowrap;font-size:4vh;font-weight:600;color:var(--ink2);font-variant-numeric:tabular-nums;overflow:hidden}
#bar .k{font-size:2.8vh;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--ink2);margin-right:1.6vh}
#bar b{color:var(--ink);font-weight:700}
#bar .sep{display:inline-block;width:2px;height:4.6vh;background:var(--hair);margin:0 3.2vh}
#bar .gust{display:inline-block;padding:.5vh 1.7vh;border-radius:99px;color:#1D1D1F;font-weight:800;margin:0 .6vh}
#bar svg{width:5vh;height:5vh;margin-right:1.4vh;vertical-align:-1.1vh}
#bar .t{margin-left:2.6vh}#bar .t:first-child{margin-left:0}
#bar .hi{color:var(--blue)}#bar .lo{color:var(--amber)}
</style>
</head>
<body>
<div id="app">
  <div id="bar"><span class="k">Tomorrow</span><span id="bwind">–</span><span class="sep"></span><span class="k">Tides</span><span id="btide">–</span><span id="upd" style="display:none"></span><span id="diag" style="display:none"></span></div>
  <main id="stage"></main>
  <div id="full"></div>
  
</div>

<script>
const $=s=>document.querySelector(s), NS="http://www.w3.org/2000/svg";
let WX=null, TIDE=null, VIDEOS={};

const fmtT=d=>d.toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit",timeZone:CONFIG.tz});
const fmtDay=d=>d.toLocaleDateString("en-GB",{weekday:"long",day:"numeric",timeZone:CONFIG.tz});
const compass=d=>["N","NNE","NE","ENE","E","ESE","SE","SSE","S","SSW","SW","WSW","W","WNW","NW","NNW"][Math.round(d/22.5)%16];
function el(tag,a={},p){const e=document.createElementNS(NS,tag);let st="";for(const k in a){const v=a[k];if(typeof v==="string"&&v.startsWith("var("))st+=`${k}:${v};`;else e.setAttribute(k,v);}if(st)e.setAttribute("style",st);if(p)p.appendChild(e);return e;}
function txt(p,x,y,s,a={}){const t=el("text",Object.assign({x,y,fill:"var(--ink2)","font-family":"Inter","font-size":14,"font-weight":600},a),p);t.textContent=s;return t;}
function localHour(ms){return +new Intl.DateTimeFormat("en-GB",{hour:"2-digit",hour12:false,timeZone:CONFIG.tz}).format(new Date(ms))%24;}
function startOfLocalDay(ms){const p=new Intl.DateTimeFormat("en-CA",{timeZone:CONFIG.tz,hour:"2-digit",minute:"2-digit",hour12:false}).formatToParts(new Date(ms));
  const g=k=>+p.find(x=>x.type===k).value; return ms-((g("hour")%24)*3600e3+g("minute")*60e3)-(ms%60e3);}

/* Windguru-like wind colour scale (knots) */
const WG=[[0,"#FFFFFF"],[5,"#E8F6FF"],[8,"#BDEBFF"],[11,"#8EF3E3"],[14,"#7BEA7B"],[17,"#C8F03C"],[20,"#FFE53C"],[23,"#FFB03C"],[26,"#FF6E46"],[30,"#F0466E"],[35,"#D246C8"],[40,"#9650E6"]];
function hex(h){return [1,3,5].map(i=>parseInt(h.slice(i,i+2),16));}
function windColor(k){for(let i=0;i<WG.length-1;i++){const[a,ca]=WG[i],[b,cb]=WG[i+1];if(k<=b){const t=Math.max(0,(k-a)/(b-a)),A=hex(ca),B=hex(cb);return`rgb(${A.map((v,j)=>Math.round(v+(B[j]-v)*t))})`;}}return WG[WG.length-1][1];}
const textOn=k=>k>=33?"#fff":"#1D1D1F";
function windWord(k){return k<10?["Light","#F2F2F4","#6E6E73"]:k<14?["Marginal","#E8F6FF","#0066CC"]:k<22?["Kiteable","#E3F7E3","#1E7A1E"]:k<28?["Strong","#FFF1D6","#B25000"]:["Very strong","#FFE3E3","#C0282D"];}

/* ---------- data ---------- */
async function loadWeather(){
  const u=`https://api.open-meteo.com/v1/forecast?latitude=${CONFIG.lat}&longitude=${CONFIG.lon}`+
  `&current=wind_speed_10m,wind_gusts_10m,wind_direction_10m&hourly=wind_speed_10m,wind_gusts_10m,wind_direction_10m,temperature_2m,cloud_cover,precipitation`+
  `&wind_speed_unit=kn&models=gfs_seamless&timezone=${encodeURIComponent(CONFIG.tz)}&timeformat=unixtime&forecast_days=4`;
  WX=await(await fetch(u)).json();
  if(WX&&WX.current&&WX.current.time){const off=WX.current.time*1000-Date.now();CLOCK_OFF=Math.abs(off)>20*60e3?off:0;}
}
async function loadTide(){
  const u=`https://marine-api.open-meteo.com/v1/marine?latitude=${CONFIG.lat}&longitude=${CONFIG.lon}`+
  `&hourly=sea_level_height_msl&timezone=${encodeURIComponent(CONFIG.tz)}&timeformat=unixtime&past_days=1&forecast_days=3&cell_selection=sea`;
  const j=await(await fetch(u)).json(), t=j.hourly.time.map(s=>s*1000), h=j.hourly.sea_level_height_msl, ext=[];
  for(let i=1;i<h.length-1;i++){ if(h[i]==null||h[i-1]==null||h[i+1]==null)continue;
    const mx=h[i]>=h[i-1]&&h[i]>h[i+1], mn=h[i]<=h[i-1]&&h[i]<h[i+1]; if(!mx&&!mn)continue;
    const a=(h[i-1]-2*h[i]+h[i+1])/2,b=(h[i+1]-h[i-1])/2,dx=a?-b/(2*a):0;
    ext.push({t:t[i]+dx*3600e3,h:a?h[i]-b*b/(4*a):h[i],type:mx?"high":"low"}); }
  TIDE={t,h,ext};
}
async function loadVideos(){
  try{const r=await fetch(CONFIG.videoList+"?t="+Date.now(),{cache:"no-store"});if(r.ok)VIDEOS=await r.json();dbg("video list: "+(VIDEOS.channels||[]).map(c=>c.videos.length).join("/")+" (http "+r.status+")");}catch(e){console.warn("video list",e);dbg("video list FAILED "+e.message);}
}
async function refreshAll(){await Promise.allSettled([loadWeather(),loadTide(),loadVideos()]);renderSide();setTimeout(renderSide,800);$("#upd").textContent="updated "+fmtT(new Date());}

/* ---------- sidebar ---------- */
const FORCE_THEME=new URLSearchParams(location.search).get("theme"); // ?theme=day or ?theme=night to test
let CLOCK_OFF=0; // corrects a wrong TV clock using the weather server time
function nowMs(){return Date.now()+CLOCK_OFF;}
function applyTheme(){const h=localHour(nowMs());const t=FORCE_THEME||((h>=6&&h<18)?"day":"night");document.documentElement.dataset.theme=t;document.querySelectorAll("#logos img").forEach(im=>{const want=t==="night"?im.dataset.n:im.dataset.d;if(want&&im.getAttribute("src")!==want)im.setAttribute("src",want);});}
function tick(){applyTheme();}
let ST=null;
async function loadStation(){try{const j=await(await fetch("https://www.windguru.cz/int/iapi.php?q=station_data_current&id_station="+CONFIG.station,{cache:"no-store"})).json();ST=(j&&j.wind_avg!=null&&Date.now()/1000-j.unixtime<2700)?j:null;}catch(e){ST=null;}renderWindNow();}
function tomorrowStart(){const d0=startOfLocalDay(nowMs());return startOfLocalDay(d0+36*3600e3);} // DST-safe
function renderWindNow(){                                 // tomorrow, daytime 09-17 h: average, max gust, direction
  if(!WX||!WX.hourly)return;const H=WX.hourly,t1=tomorrowStart(),t2=t1+24*3600e3;let n=0,sum=0,gmax=0,sx=0,sy=0;
  for(let i=0;i<H.time.length;i++){const ms=H.time[i]*1000;if(ms<t1||ms>=t2)continue;const h=localHour(ms);if(h<9||h>17)continue;
    const k=H.wind_speed_10m[i],g=H.wind_gusts_10m[i],d=H.wind_direction_10m[i];if(k==null)continue;
    n++;sum+=k;gmax=Math.max(gmax,g||0);sx+=Math.sin(d*Math.PI/180)*k;sy+=Math.cos(d*Math.PI/180)*k;}
  if(!n)return;const k=sum/n,d=(Math.atan2(sx,sy)*180/Math.PI+360)%360;
  $("#bwind").innerHTML=`<svg viewBox="-50 -50 100 100"><g transform="rotate(${d+180})"><path d="M0,-38 L17,28 L0,15 L-17,28 Z" style="fill:var(--ink)"/></g></svg>`+
    `<b>${Math.round(k)} kn</b> · gusts <span class="gust" style="background:${windColor(gmax)}">${Math.round(gmax)} kn</span> · ${compass(d)}`;
}
function fitBar(){const b=$("#bar");b.style.fontSize="";let f=4;while(b.scrollWidth>b.clientWidth&&f>2){f-=.2;b.style.fontSize=f+"vh";}}
window.addEventListener("resize",fitBar);
function renderSide(){
  renderWindNow();
  if(TIDE){const t1=tomorrowStart(),t2=t1+24*3600e3;
    $("#btide").innerHTML=TIDE.ext.filter(e=>e.t>=t1&&e.t<t2).map(e=>`<span class="t ${e.type==="high"?"hi":"lo"}">${e.type==="high"?"▲":"▼"} <b class="${e.type==="high"?"hi":"lo"}">${fmtT(new Date(e.t))}</b></span>`).join("")||"–";}
  fitBar();
}

/* ---------- tide chart ---------- */
function interp(ms){const t=TIDE.t,h=TIDE.h;for(let i=0;i<t.length-1;i++)if(ms>=t[i]&&ms<=t[i+1]&&h[i]!=null&&h[i+1]!=null)return h[i]+(h[i+1]-h[i])*(ms-t[i])/(t[i+1]-t[i]);return null;}
function drawTide(box,t0,t1,opt={}){
  box.innerHTML="";const m=opt.mini,id=m?"m":"b";
  const BW=box.clientWidth||(m?400:1200),BH=box.clientHeight||(m?150:600),W=m?400:1200,H=Math.round(W*BH/BW),pl=m?6:10,pr=m?6:10,pt=m?28:110,pb=m?28:150;
  const svg=el("svg",{viewBox:`0 0 ${W} ${H}`},box);
  const pts=TIDE.t.map((t,i)=>[t,TIDE.h[i]]).filter(p=>p[0]>=t0-3600e3&&p[0]<=t1+3600e3&&p[1]!=null);
  if(!pts.length){txt(svg,20,40,"No tide data");return;}
  const hs=TIDE.h.filter(v=>v!=null),mn=Math.min(...hs),mx=Math.max(...hs),pad=(mx-mn)*.08;
  const X=t=>pl+(t-t0)/(t1-t0)*(W-pl-pr),Y=v=>pt+(1-(v-mn+pad)/(mx-mn+2*pad))*(H-pt-pb);
  const defs=el("defs",{},svg),gr=el("linearGradient",{id:"tg"+id,x1:0,y1:0,x2:0,y2:1},defs);
  el("stop",{offset:"0","stop-color":"var(--tide)","stop-opacity":.38},gr);el("stop",{offset:"1","stop-color":"var(--tide)","stop-opacity":.04},gr);
  const clip=el("clipPath",{id:"tc"+id},defs);el("rect",{x:pl,y:0,width:W-pl-pr,height:H},clip);
  if(!m)for(let d=t0;d<t1;d+=864e5){
    if(d>t0)el("line",{x1:X(d),x2:X(d),y1:pt-40,y2:H-pb,stroke:"var(--hair)","stroke-width":2},svg);
    txt(svg,X(d)+14,H-14,fmtDay(new Date(d)),{"font-size":30,"font-weight":800,fill:"var(--ink)"});
    for(const hh of[6,12,18])txt(svg,X(d+hh*3600e3),H-56,String(hh).padStart(2,"0")+":00",{"text-anchor":"middle","font-size":18});
  }
  const P=pts.map(p=>[X(p[0]),Y(p[1])]);let d=`M${P[0][0]},${P[0][1]}`;
  for(let i=0;i<P.length-1;i++){const p0=P[i-1]||P[i],p1=P[i],p2=P[i+1],p3=P[i+2]||p2;
    d+=` C${p1[0]+(p2[0]-p0[0])/6},${p1[1]+(p2[1]-p0[1])/6} ${p2[0]-(p3[0]-p1[0])/6},${p2[1]-(p3[1]-p1[1])/6} ${p2[0]},${p2[1]}`;}
  const g=el("g",{"clip-path":`url(#tc${id})`},svg);
  el("path",{d:d+` L${P[P.length-1][0]},${H-pb} L${P[0][0]},${H-pb} Z`,fill:`url(#tg${id})`},g);
  el("path",{d,fill:"none",stroke:"var(--tide)","stroke-width":m?4:6,"stroke-linecap":"round"},g);
  for(const e of TIDE.ext.filter(e=>e.t>=t0&&e.t<=t1)){
    const x0=X(e.t),x=Math.max(pl+(m?22:60),Math.min(W-pr-(m?22:60),x0)),y=Y(e.h),hi=e.type==="high",c=hi?"var(--blue)":"var(--amber)";
    el("circle",{cx:x0,cy:y,r:m?4:7,fill:"var(--card)",stroke:c,"stroke-width":m?3:4.5},svg);
    if(m){txt(svg,x,hi?y-9:y+20,fmtT(new Date(e.t)),{"text-anchor":"middle","font-size":17,"font-weight":800,fill:c});}
    else{txt(svg,x,hi?y-46:y+52,fmtT(new Date(e.t)),{"text-anchor":"middle","font-size":40,"font-weight":800,fill:c,"letter-spacing":"-0.5"});
         txt(svg,x,hi?y-20:y+78,(hi?"High · ":"Low · ")+e.h.toFixed(1)+" m",{"text-anchor":"middle","font-size":20,"font-weight":700,fill:c});}
  }
  const now=Date.now();if(now>=t0&&now<=t1){const x=X(now),v=interp(now);
    el("line",{x1:x,x2:x,y1:m?0:pt-40,y2:H-(m?pb:pb-40),stroke:"var(--ink)","stroke-width":m?1.5:2.5,"stroke-dasharray":"4 6"},svg);
    if(v!=null)el("circle",{cx:x,cy:Y(v),r:m?6:11,fill:"var(--ink)",stroke:"var(--card)","stroke-width":3},svg);
    if(!m&&v!=null)txt(svg,x+18,Y(v)+7,"NOW",{"font-size":20,"font-weight":800,fill:"var(--ink)"});}
}

/* ---------- Windguru-style forecast table ---------- */
function arrowSvg(deg){return`<svg viewBox="-12 -12 24 24"><g transform="rotate(${deg+180})"><path d="M0,-10 L6,8 L0,4 L-6,8 Z" style="fill:var(--ink)"/></g></svg>`;}
function cloudIcon(c,p){ if(p>=0.5)return"🌧"; return c<25?"☀︎":c<60?"⛅︎":"☁︎"; }
function drawForecast(box){
  if(!WX||!WX.hourly){box.innerHTML='<div class="err">Forecast unavailable</div>';return;}
  const H=WX.hourly,d0=startOfLocalDay(Date.now()),HOURS=[6,9,12,15,18],days=[0,1,2];
  const cols=[];days.forEach(dd=>HOURS.forEach((hr,k)=>{const ms=d0+dd*864e5+hr*3600e3,i=H.time.findIndex(t=>Math.abs(t*1000-ms)<1800e3);if(i>=0)cols.push({i,dd,k,ms});}));
  const row=(lbl,f,cls="")=>`<tr class="r-${cls||"x"}"><td class="rowlbl">${lbl}</td>${cols.map(c=>`<td class="${cls} ${c.k===0&&c.dd>0?"sep":""}" ${f.style?`style="${f.style(c.i)}"`:""}>${f(c.i)}</td>`).join("")}</tr>`;
  const ws=i=>Math.round(H.wind_speed_10m[i]); ws.style=i=>`background:${windColor(H.wind_speed_10m[i])};color:${textOn(H.wind_speed_10m[i])}`;
  const gs=i=>Math.round(H.wind_gusts_10m[i]); gs.style=i=>`background:${windColor(H.wind_gusts_10m[i])};color:${textOn(H.wind_gusts_10m[i])}`;
  box.innerHTML=`<table class="wg"><thead>
    <tr class="day"><th class="rowlbl"></th>${days.map(dd=>`<th colspan="${HOURS.length}" style="text-align:left;padding-left:.5vw">${fmtDay(new Date(d0+dd*864e5+12*3600e3))}</th>`).join("")}</tr>
    <tr class="hr"><th class="rowlbl"></th>${cols.map(c=>`<th>${String(HOURS[c.k]).padStart(2,"0")}h</th>`).join("")}</tr></thead><tbody>
    ${row("Wind kn",ws,"c")}${row("Gusts kn",gs,"g")}
    ${row("Direction",i=>arrowSvg(H.wind_direction_10m[i]),"dir")}
    ${row("Temp °C",i=>Math.round(H.temperature_2m[i])+"°","small")}
  </tbody></table>
  <div class="legend">${[6,10,14,18,22,26,30,35].map(k=>`<span><i style="background:${windColor(k)};box-shadow:inset 0 0 0 1px rgba(0,0,0,.06)"></i> ${k}</span>`).join("")}<span style="margin-left:auto">Knots · arrows show where the wind blows</span></div>`;
}

/* ---------- YouTube clip rotation ---------- */
/* Schedule (time-based): CONFIG.videoMinutes of YouTube clips (each max CONFIG.clipSeconds),
   then the wind forecast for CONFIG.forecastSeconds, repeat. A failed clip is replaced by
   another clip straight away — it never falls back to looping the forecast.
   The same section of a video never replays within CONFIG.noRepeatMinutes (log kept in
   this browser, survives reboots). Clips are never paused/resumed (that froze on some PCs). */
const DBG=/[?&]debug/.test(location.search),DLOG=[];
function dbg(m){const t=new Date().toLocaleTimeString("en-GB");DLOG.push(t+" "+m);if(DLOG.length>18)DLOG.shift();
  if(DBG){let o=document.getElementById("dbg");if(!o){o=document.createElement("pre");o.id="dbg";o.style.cssText="position:fixed;left:0;top:0;z-index:99;background:rgba(0,0,0,.85);color:#0f0;font:14px/1.3 monospace;padding:10px;max-width:60vw;white-space:pre-wrap;pointer-events:none";document.body.appendChild(o);}o.textContent=DLOG.join("\n");}}
window.addEventListener("error",e=>dbg("JS error: "+e.message));
function diag(m){console.warn(m);dbg("! "+m);const e=document.getElementById("diag");if(e){e.textContent=String(m).slice(0,40);setTimeout(()=>{if(e.textContent===String(m).slice(0,40))e.textContent="";},60000);}}

const LOGKEY="ptvLog", BAD={}, DUR={};
let SLOT=0;
/* the channel each clip slot should come from, spread evenly by CONFIG.channelMix (e.g. B B E B B) */
function mixPattern(){const m=CONFIG.channelMix||{},keys=Object.keys(m).sort((a,b)=>m[b]-m[a]),tot=keys.reduce((s,k)=>s+m[k],0),P=[],c={};
  for(let i=0;i<tot;i++){let best=null,bv=-1e9;for(const k of keys){const v=(i+1)*m[k]/tot-(c[k]||0);if(v>bv){bv=v;best=k;}}c[best]=(c[best]||0)+1;P.push(best);}return P;}
function getLog(){try{return JSON.parse(localStorage.getItem(LOGKEY)||"[]");}catch(e){return [];}}
function setLog(l){try{localStorage.setItem(LOGKEY,JSON.stringify(l));}catch(e){}}
function recentLog(){const cut=Date.now()-CONFIG.noRepeatMinutes*60e3;const l=getLog().filter(x=>x.t>cut&&x.t<=Date.now()+60e3);setLog(l);return l;}
function logPlay(id,s,e){const l=recentLog();l.push({id,s,e,t:Date.now()});setLog(l);}
/* pick a fresh window [start,end] (seconds) in a video of length dur, avoiding recently played ones */
function pickWindow(id,dur){
  const L=CONFIG.clipSeconds,used=recentLog().filter(x=>x.id===id);
  const free=(s,e)=>used.every(u=>e<=u.s||s>=u.e);
  if(dur<=L+5)return free(0,dur)?[0,dur]:null;          // short video: play it whole
  const lo=Math.min(8,dur-L),hi=dur-L-2;                // skip intro seconds and the very end
  for(let k=0;k<40;k++){const s=Math.floor(lo+Math.random()*Math.max(1,hi-lo));if(free(s,s+L))return[s,s+L];}
  return null;
}
/* next candidates: the channel this slot belongs to (see channelMix) first, least-recently-played
   video first; the other channels follow only as a fallback if nothing from it will play */
function candidates(){
  const chs=(VIDEOS.channels||[]).filter(c=>c.videos&&c.videos.length);if(!chs.length)return[];
  const P=mixPattern(),want=P.length?P[SLOT%P.length]:chs[0].key;
  const last={};for(const x of recentLog())last[x.id]=Math.max(last[x.id]||0,x.t);
  const list=c=>c.videos.filter(v=>!(BAD[v.id]>Date.now())&&!(DUR[v.id]&&!pickWindow(v.id,DUR[v.id])))
      .map(v=>Object.assign({},v,{ch:c.name,r:Math.random()})).sort((a,b)=>(last[a.id]||0)-(last[b.id]||0)||a.r-b.r);
  const first=chs.filter(c=>c.key===want),rest=chs.filter(c=>c.key!==want&&(CONFIG.channelMix||{})[c.key]!==0);
  const out=[];for(const c of first)out.push(...list(c));for(const c of rest)out.push(...list(c));
  return out;
}
let YT_READY=null;
function ytApi(){if(!YT_READY)YT_READY=new Promise((ok,no)=>{if(window.YT&&YT.Player)return ok();window.onYouTubeIframeAPIReady=ok;
  const s=document.createElement("script");s.src="https://www.youtube.com/iframe_api";s.onerror=()=>{YT_READY=null;no(new Error("YouTube API blocked"));};document.head.appendChild(s);});return YT_READY;}

/* Load one clip in a hidden slide and get it PLAYING at its window start. It keeps playing
   (muted, hidden) until shown — no pause/resume. Resolves {d,p,v,win} or null. */
async function prepClip(v){
  dbg("prep "+v.ch+" "+v.id);
  try{await ytApi();}catch(e){diag(e.message);return null;}
  const d=document.createElement("div");d.className="slide yt";
  d.innerHTML=`<div class="ytbox"><div></div></div><div class="cap"><span>${v.ch}</span>${v.title.replace(/</g,"&lt;")}</div>`;
  $("#stage").appendChild(d);
  return new Promise(ok=>{
    let fin=false,win=null,p=null;
    const end=r=>{if(fin)return;fin=true;clearTimeout(to);if(!r){try{p&&p.destroy();}catch(e){}d.remove();}ok(r);};
    const to=setTimeout(()=>{diag("load timeout "+v.id);end(null);},CONFIG.loadTimeoutSec*1000);
    p=new YT.Player(d.querySelector(".ytbox div"),{videoId:v.id,width:"100%",height:"100%",
      playerVars:{autoplay:1,mute:1,controls:0,rel:0,playsinline:1,iv_load_policy:3,disablekb:1,fs:0,modestbranding:1,cc_load_policy:0},
      events:{
        onReady:e=>{dbg("ready "+v.id);try{e.target.mute();e.target.unloadModule("captions");e.target.unloadModule("cc");}catch(x){}e.target.playVideo();},
        onError:e=>{diag("yt error "+e.data+" "+v.id);BAD[v.id]=Date.now()+6*3600e3;end(null);},
        onStateChange:e=>{
          if(fin||e.data!==YT.PlayerState.PLAYING)return;
          const t=p.getCurrentTime();dbg("playing "+v.id+" t="+Math.round(t));
          if(!win){
            const dur=Math.floor(p.getDuration()||0);
            if(!dur){BAD[v.id]=Date.now()+3600e3;diag("no length "+v.id);end(null);return;}   // live stream etc.
            DUR[v.id]=dur;win=pickWindow(v.id,dur);if(!win){end(null);return;}
            if(win[0]>2){p.seekTo(win[0],true);return;}                                 // wait for PLAYING after the seek
          }
          if(Math.abs(t-win[0])<6)end({d,p,v,win});
        }}});
  });
}
/* find the next playable clip; tries up to 5 different videos */
async function nextClip(){
  let tries=0;
  for(const v of candidates()){
    if(tries++>=5)break;
    const r=await prepClip(v);
    if(r){SLOT++;return r;}
  }
  return null;
}

/* ---------- scheduler ---------- */
let current=null,curPlayer=null,PREP=null,videoUntil=0,timer=null,watch=null;
function makeForecast(){                                 // placeholder only (shown if YouTube is down)
  const d=document.createElement("div");d.className="slide";d.style.cssText="align-items:center;justify-content:center";
  d.innerHTML=`<img src="${$("#lg-eg").getAttribute("src")}" style="width:30%;height:auto;opacity:.9">`;
  $("#stage").appendChild(d);return d;
}
function show(d,player){
  requestAnimationFrame(()=>requestAnimationFrame(()=>d.classList.add("on")));
  if(current&&current!==d){const o=current,op=curPlayer;o.classList.remove("on");setTimeout(()=>{try{op&&op.destroy();}catch(e){}o.remove();},1500);}
  current=d;curPlayer=player||null;
}
function startPrep(){if(!PREP)PREP=nextClip();}
function showForecast(){
  clearTimeout(timer);clearInterval(watch);
  dbg("forecast "+CONFIG.forecastSeconds+" s");
  show(makeForecast());
  videoUntil=0;                                          // next clip starts a new video block
  startPrep();                                           // load the first clip while the forecast is up
  timer=setTimeout(playNext,CONFIG.forecastSeconds*1000);
}
async function playNext(){
  clearTimeout(timer);clearInterval(watch);
  if(!videoUntil)videoUntil=Date.now()+CONFIG.videoMinutes*60e3;
  else if(Date.now()>=videoUntil){showForecast();return;}
  const r=await(PREP||nextClip());PREP=null;
  if(!r){                                                 // YouTube not working right now: forecast, retry after it
    diag("no clip available");
    if(!current||current.classList.contains("yt"))show(makeForecast());
    timer=setTimeout(playNext,15000);return;
  }
  const {d,p,v,win}=r;
  dbg("show "+v.id+" "+win[0]+"-"+win[1]);
  try{if(p.getCurrentTime()-win[0]>1.5)p.seekTo(win[0],true);}catch(e){}  // it played hidden for a few s: rewind to the clip start
  show(d,p);logPlay(v.id,win[0],win[1]);
  const lastClip=Date.now()+(win[1]-win[0])*1000>=videoUntil;
  let last=-1,still=0,prepped=false;
  watch=setInterval(()=>{
    let t=0,st=-1;try{t=p.getCurrentTime();st=p.getPlayerState();}catch(e){}
    if(t>=win[1]-0.3||st===YT.PlayerState.ENDED){clearInterval(watch);lastClip?showForecast():playNext();return;}
    if(!prepped&&!lastClip&&t>=win[1]-12){prepped=true;startPrep();}  // load the next clip 12 s early
    if(st!==YT.PlayerState.PLAYING&&st!==YT.PlayerState.BUFFERING){try{p.playVideo();}catch(e){}}
    if(Math.abs(t-last)<0.05){if(++still>=CONFIG.stallSec*2){diag("stalled "+v.id);clearInterval(watch);playNext();}}else{still=0;last=t;}
  },500);
  timer=setTimeout(()=>{clearInterval(watch);playNext();},((win[1]-win[0])+CONFIG.stallSec+20)*1000);  // hard cap
}
function next(){playNext();}

/* Android / Chrome app mode: installable full screen, keep the screen awake, tap = full screen */
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
let WAKE=null;async function keepAwake(){try{if("wakeLock" in navigator&&document.visibilityState==="visible")WAKE=await navigator.wakeLock.request("screen");}catch(e){}}
keepAwake();document.addEventListener("visibilitychange",keepAwake);setInterval(()=>{if(!WAKE||WAKE.released)keepAwake();},60e3);
document.addEventListener("click",()=>{const el=document.documentElement;if(!document.fullscreenElement&&el.requestFullscreen)el.requestFullscreen().catch(()=>{});keepAwake();});

/* auto-update: reload when a newer version is published */
const VERSION="ptv-2026-11-16b";
document.documentElement.style.setProperty("--leftsafe",(CONFIG.leftSafe||0)+"vw");
async function checkUpdate(){try{const t=await(await fetch(location.pathname+"?v="+Date.now(),{cache:"no-store"})).text();const m=t.match(/const VERSION="([^"]+)"/);if(m&&m[1]!==VERSION)location.replace(location.pathname+"?v="+Date.now()+(FORCE_THEME?"&theme="+FORCE_THEME:""));}catch(e){}}
checkUpdate();setInterval(checkUpdate,CONFIG.updateCheckMinutes*60e3);
tick();setInterval(tick,10000);
refreshAll().then(next);
setInterval(refreshAll,CONFIG.refreshMinutes*60e3);
setTimeout(()=>location.reload(),6*3600e3);
</script>
