name: Update projector videos
on:
  schedule:
    - cron: "17 */6 * * *"   # every 6 hours
  workflow_dispatch:          # "Run workflow" button for a manual refresh
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/fetch-videos.mjs
      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain videos.json)" ]; then
            git config user.name "projector-bot"
            git config user.email "actions@users.noreply.github.com"
            git add videos.json
            git commit -m "Update projector video list"
            git push
          fi
